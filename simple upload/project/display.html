<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Gallery</title>

<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f4f4f4;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    /* Grid */
    .gallery-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
    }

    /* Card */
    .card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        transition: 0.3s;
    }

    .card:hover {
        transform: scale(1.03);
    }

    /* Image / Video */
    .card-media {
        width: 100%;
        height: 180px;
        object-fit: cover;
    }

    /* Text Section */
    .card-content {
        padding: 15px;
    }

    .card-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .card-uploader {
        color: gray;
        font-size: 14px;
    }
</style>
</head>

<body>

<h1>Gallery</h1>

<div class="gallery-container">

    <!-- Card 1 (Image) -->
    <div class="card">
        <img src="https://via.placeholder.com/300" class="card-media" />
        <div class="card-content">
            <div class="card-title">Beautiful Decoration</div>
            <div class="card-uploader">Uploaded by: RK Events</div>
        </div>
    </div>

    <!-- Card 2 (Video) -->
    <div class="card">
        <video class="card-media" controls>
            <source src="sample.mp4" type="video/mp4">
        </video>
        <div class="card-content">
            <div class="card-title">Wedding Stage Setup</div>
            <div class="card-uploader">Uploaded by: Ravi Kumar</div>
        </div>
    </div>

    <!-- Card 3 -->
    <div class="card">
        <img src="https://via.placeholder.com/300" class="card-media" />
        <div class="card-content">
            <div class="card-title">Flower Decorations</div>
            <div class="card-uploader">Uploaded by: RK Events</div>
        </div>
    </div>

</div>

</body>
</html>
